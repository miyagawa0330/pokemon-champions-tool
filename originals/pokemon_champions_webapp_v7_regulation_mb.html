<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f8fa3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ポケモンCH検索">
  <title>ポケモンチャンピオンズ検索ツール</title>
  <style>
    :root {
      --bg: #eaf6f8;
      --card: #ffffff;
      --main: #4f8fa3;
      --main-dark: #366d80;
      --soft: #d7eef3;
      --text: #2f3b40;
      --muted: #66777e;
      --line: #c9e1e7;
      --danger-bg: #fff8f8;
      --danger-line: #ffd3d3;
      --danger-text: #8b3a3a;
      --shadow: 0 10px 28px rgba(35, 77, 90, 0.12);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: linear-gradient(180deg, var(--bg), #f7fbfc);
      color: var(--text);
      line-height: 1.55;
    }
    .app { max-width: 980px; margin: 0 auto; padding: 18px 14px 48px; }
    header {
      padding: 18px 4px 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .title-wrap { min-width: 0; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: -0.03em; color: var(--main-dark); }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--main-dark);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 16px;
    }
    @media (min-width: 720px) { .tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .tab-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--main-dark);
      border-radius: 16px;
      min-height: 52px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 6px 16px rgba(35, 77, 90, 0.08);
    }
    .tab-btn.active { background: var(--main); color: #fff; border-color: var(--main); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 0 0 14px;
    }
    .card h2 { margin: 0 0 12px; font-size: 20px; color: var(--main-dark); }
    .card h3 { margin: 16px 0 8px; font-size: 16px; color: var(--main-dark); }
    label { display: block; font-weight: 700; margin: 12px 0 6px; color: var(--text); }
    input, select {
      width: 100%;
      appearance: none;
      border: 1px solid var(--line);
      background: #fbfeff;
      color: var(--text);
      border-radius: 14px;
      min-height: 48px;
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--main); box-shadow: 0 0 0 3px rgba(79, 143, 163, 0.18); }
    .grid { display: grid; gap: 12px; }
    @media (min-width: 720px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button.action {
      border: 0;
      border-radius: 14px;
      background: var(--main);
      color: white;
      font-weight: 800;
      font-size: 16px;
      padding: 12px 16px;
      min-height: 48px;
      flex: 1 1 160px;
    }
    button.secondary { background: var(--soft); color: var(--main-dark); }
    .result { margin-top: 14px; }
    .result-card {
      border: 1px solid var(--line);
      background: #fbfeff;
      border-radius: 16px;
      padding: 14px;
      margin: 10px 0;
    }
    .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .poke-name, .move-name { font-size: 20px; font-weight: 900; color: var(--main-dark); }
    .types { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .type-pill {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--soft);
      color: var(--main-dark);
      font-size: 12px;
      font-weight: 800;
    }
    .stats { width: 100%; border-collapse: collapse; margin-top: 10px; overflow: hidden; border-radius: 12px; }
    .stats th, .stats td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: right; font-size: 14px; }
    .stats th:first-child, .stats td:first-child { text-align: left; color: var(--muted); }
    .stats tr:last-child th, .stats tr:last-child td { border-bottom: 0; }
    .mini { font-size: 13px; color: var(--muted); }
    .error { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger-text); }
    .success { border-color: var(--line); background: #fbfeff; }
    .match-group { margin: 10px 0; }
    .match-title { font-weight: 900; color: var(--main-dark); margin-bottom: 5px; }
    .chip-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .damage-output {
      font-size: clamp(26px, 8vw, 42px);
      font-weight: 900;
      color: var(--main-dark);
      letter-spacing: -0.04em;
      text-align: center;
      padding: 20px 8px 8px;
    }
    .move-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    @media (min-width: 720px) { .move-meta { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .meta-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 10px;
      background: white;
    }
    .meta-label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .meta-value { display: block; color: var(--main-dark); font-weight: 900; font-size: 16px; }
    .effect-text { margin: 12px 0 0; }

    .autocomplete-wrap { position: relative; }
    .suggestions {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      z-index: 50;
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
    }
    .suggestions[hidden] { display: none; }
    .suggestion-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: white;
      color: var(--text);
      text-align: left;
      padding: 10px 10px;
      font-size: 15px;
      font-weight: 700;
      min-height: 42px;
    }
    .suggestion-btn:active,
    .suggestion-btn:hover {
      background: var(--soft);
      color: var(--main-dark);
    }
    .suggestion-sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .footer-note { margin-top: 18px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>ポケモンチャンピオンズ検索ツール</h1>
      </div>
      <div class="badge">313体 / 技466種</div>
    </header>

    <nav class="tabs" aria-label="機能選択">
      <button class="tab-btn active" data-tab="search">1 ポケモン名</button>
      <button class="tab-btn" data-tab="compare">2 種族値比較</button>
      <button class="tab-btn" data-tab="type">3 タイプ相性</button>
      <button class="tab-btn" data-tab="damage">4 ダメージ計算</button>
      <button class="tab-btn" data-tab="moveSearch">5 技検索</button>
    </nav>

    <section id="search" class="panel active">
      <div class="card">
        <h2>ポケモン名</h2>
        <label for="searchName">ポケモン名を入力</label>
        <input id="searchName" list="pokemonNames" placeholder="例：ゲンガー、メガリザードンX" autocomplete="off">
        <div class="action-row"><button class="action" id="searchBtn">検索</button></div>
        <div id="searchResult" class="result"></div>
      </div>
    </section>

    <section id="compare" class="panel">
      <div class="card">
        <h2>種族値比較</h2>
        <div class="grid two">
          <div>
            <label for="compareA">1匹目</label>
            <input id="compareA" list="pokemonNames" placeholder="例：ゲンガー" autocomplete="off">
          </div>
          <div>
            <label for="compareB">2匹目</label>
            <input id="compareB" list="pokemonNames" placeholder="例：メガゲンガー" autocomplete="off">
          </div>
        </div>
        <div class="action-row"><button class="action" id="compareBtn">比較</button></div>
        <div id="compareResult" class="result"></div>
      </div>
    </section>

    <section id="type" class="panel">
      <div class="card">
        <h2>タイプ相性</h2>
        <label for="typeMode">検索方法</label>
        <select id="typeMode">
          <option value="attack">使用する技のタイプから検索</option>
          <option value="defense">防御側のタイプから検索</option>
        </select>
        <label for="typeSelect">タイプ</label>
        <select id="typeSelect"></select>
        <div class="action-row"><button class="action" id="typeBtn">表示</button></div>
        <div id="typeResult" class="result"></div>
      </div>
    </section>

    <section id="damage" class="panel">
      <div class="card">
        <h2>ダメージ計算</h2>
        <div class="grid three">
          <div>
            <label for="attackerName">攻撃側ポケモン</label>
            <input id="attackerName" list="pokemonNames" placeholder="例：メガゲンガー" autocomplete="off">
          </div>
          <div>
            <label for="defenderName">防御側ポケモン</label>
            <input id="defenderName" list="pokemonNames" placeholder="例：カビゴン" autocomplete="off">
          </div>
          <div>
            <label for="moveName">技</label>
            <input id="moveName" list="moveNames" placeholder="例：シャドーボール" autocomplete="off">
          </div>
        </div>
        <div class="action-row"><button class="action" id="damageBtn">計算</button></div>
        <div id="damageResult" class="result"></div>
      </div>
    </section>

    <section id="moveSearch" class="panel">
      <div class="card">
        <h2>技検索</h2>
        <label for="moveSearchName">技名を入力</label>
        <input id="moveSearchName" list="moveNames" placeholder="例：シャドーボール、10まんボルト" autocomplete="off">
        <div class="action-row"><button class="action" id="moveSearchBtn">検索</button></div>
        <div id="moveSearchResult" class="result"></div>
      </div>
    </section>

    <datalist id="pokemonNames"></datalist>
    <datalist id="moveNames"></datalist>
    <p class="footer-note">計算条件: Lv.50 / 個体値31相当 / 参照する能力は能力ポイント32相当 / 性格補正なし / 道具補正なし。技検索は技名のみで絞り込みます。データ: レギュレーションM-B対応、2026-07-07確認。</p>
  </div>

  <script>
    const DATA = JSON.parse(document.getElementById('app-data').textContent);
    const POKEMON = DATA.pokemon;
    const TYPE_CHART_DEFENSE = DATA.typeChartDefense;
    const ALL_TYPES = DATA.allTypes;
    const MOVES = DATA.moves;
    const MOVE_ALIASES = DATA.moveAliases || {};
    const SETTINGS = DATA.settings;

    const CATEGORY_LABEL = {
      physical: '物理',
      special: '特殊',
      status: '変化'
    };

    const SPECIAL_RULE_LABEL = {
      acrobatics: '道具なし前提で、ダメージ計算では威力2倍として扱います。',
      defense_attack: 'ダメージ計算では、攻撃側の「ぼうぎょ」を攻撃能力として扱います。',
      target_attack: 'ダメージ計算では、防御側の「こうげき」を攻撃能力として扱います。',
      physical_defense: 'ダメージ計算では、特殊技ですが相手の「ぼうぎょ」を参照します。'
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function kataToHira(value) {
      return String(value ?? '').replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
    }

    function normalize(value) {
      return kataToHira(String(value ?? '').normalize('NFKC'))
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '');
    }

    const NORMALIZED_MOVE_ALIASES = {};
    Object.entries(MOVE_ALIASES).forEach(([alias, canonicalName]) => {
      NORMALIZED_MOVE_ALIASES[normalize(alias)] = canonicalName;
    });

    function renderError(message) {
      return `<div class="result-card error">${escapeHtml(message)}</div>`;
    }

    function formatTypeText(pokemon) {
      return pokemon.type2 ? `${pokemon.type1} / ${pokemon.type2}` : pokemon.type1;
    }

    function getPokemonByExactName(name) {
      const key = normalize(name);
      return POKEMON.find(p => normalize(p.name) === key) || null;
    }

    function searchPokemonByName(keyword) {
      const key = normalize(keyword);
      if (!key) return [];
      const exact = POKEMON.filter(p => normalize(p.name) === key);
      const partial = POKEMON.filter(p => normalize(p.name).includes(key) && !exact.includes(p));
      return exact.concat(partial).slice(0, 20);
    }

    function getMoveByExactName(name) {
      const key = normalize(name);
      const aliasName = NORMALIZED_MOVE_ALIASES[key];
      if (aliasName) {
        return MOVES.find(m => m.name === aliasName) || null;
      }
      return MOVES.find(m => normalize(m.name) === key) || null;
    }

    function searchMoveByName(keyword) {
      const key = normalize(keyword);
      if (!key) return [];
      const exact = [];
      const exactMove = getMoveByExactName(keyword);
      if (exactMove) exact.push(exactMove);
      const partial = MOVES.filter(m => normalize(m.name).includes(key) && !exact.includes(m));
      return exact.concat(partial).slice(0, 40);
    }

    function populateInputs() {
      const pokemonList = document.getElementById('pokemonNames');
      const moveList = document.getElementById('moveNames');
      pokemonList.innerHTML = POKEMON.map(p => `<option value="${escapeHtml(p.name)}"></option>`).join('');
      moveList.innerHTML = MOVES.map(m => `<option value="${escapeHtml(m.name)}"></option>`).join('');
      const typeSelect = document.getElementById('typeSelect');
      typeSelect.innerHTML = ALL_TYPES.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    }

    function getComboMultiplier(attackType, defenseType1, defenseType2='') {
      const m1 = (TYPE_CHART_DEFENSE[defenseType1] && TYPE_CHART_DEFENSE[defenseType1][attackType] !== undefined)
        ? TYPE_CHART_DEFENSE[defenseType1][attackType] : 1.0;
      const m2 = defenseType2 && TYPE_CHART_DEFENSE[defenseType2] && TYPE_CHART_DEFENSE[defenseType2][attackType] !== undefined
        ? TYPE_CHART_DEFENSE[defenseType2][attackType] : 1.0;
      return m1 * m2;
    }

    function classifyPokemonDefense(pokemon) {
      const groups = {'4倍':[], '2倍':[], '等倍':[], '1/2倍':[], '1/4倍':[], '無効':[]};
      ALL_TYPES.forEach(type => {
        const value = getComboMultiplier(type, pokemon.type1, pokemon.type2);
        if (value === 4) groups['4倍'].push(type);
        else if (value === 2) groups['2倍'].push(type);
        else if (value === 1) groups['等倍'].push(type);
        else if (value === 0.5) groups['1/2倍'].push(type);
        else if (value === 0.25) groups['1/4倍'].push(type);
        else if (value === 0) groups['無効'].push(type);
      });
      return groups;
    }

    function renderPokemonTypeMatchup(pokemon) {
      const groups = classifyPokemonDefense(pokemon);
      const htmlGroups = ['4倍','2倍','等倍','1/2倍','1/4倍','無効'].map(label => `
        <div class="match-group"><div class="match-title">${label}</div>
          <div class="chip-list">${groups[label].length ? groups[label].map(v => `<span class="chip">${escapeHtml(v)}</span>`).join('') : '<span class="chip">なし</span>'}</div>
        </div>`).join('');
      return `<div class="type-matchup-block">
        <div class="match-title">このポケモンが受けるタイプ相性</div>
        ${htmlGroups}
      </div>`;
    }

    function renderPokemonCard(pokemon) {
      const total = ['hp','attack','defense','sp_attack','sp_defense','speed'].reduce((sum, key) => sum + Number(pokemon[key] || 0), 0);
      const typeHtml = `<span class="type-pill">${escapeHtml(pokemon.type1)}</span>${pokemon.type2 ? `<span class="type-pill">${escapeHtml(pokemon.type2)}</span>` : ''}`;
      return `<div class="result-card success">
        <div class="name-line">
          <div class="poke-name">${escapeHtml(pokemon.name)}</div>
          <div class="types">${typeHtml}</div>
        </div>
        <p><strong>特性:</strong> ${escapeHtml(pokemon.abilities_all || '未登録')}</p>
        <p class="mini">${escapeHtml(pokemon.abilities_description_all || '')}</p>
        <table class="stats">
          <tr><th>HP</th><td>${pokemon.hp}</td><th>こうげき</th><td>${pokemon.attack}</td></tr>
          <tr><th>ぼうぎょ</th><td>${pokemon.defense}</td><th>とくこう</th><td>${pokemon.sp_attack}</td></tr>
          <tr><th>とくぼう</th><td>${pokemon.sp_defense}</td><th>すばやさ</th><td>${pokemon.speed}</td></tr>
          <tr><th>合計</th><td colspan="3">${total}</td></tr>
        </table>
        ${renderPokemonTypeMatchup(pokemon)}
      </div>`;
    }

    function renderPokemonSearch() {
      const keyword = document.getElementById('searchName').value;
      const result = document.getElementById('searchResult');
      const results = searchPokemonByName(keyword);
      if (!normalize(keyword)) {
        result.innerHTML = renderError('ポケモン名を入力してください。');
        return;
      }
      if (!results.length) {
        result.innerHTML = renderError('該当するポケモンが見つかりませんでした。');
        return;
      }
      result.innerHTML = results.map(renderPokemonCard).join('');
    }

    function compareTwoPokemon() {
      const a = getPokemonByExactName(document.getElementById('compareA').value);
      const b = getPokemonByExactName(document.getElementById('compareB').value);
      const result = document.getElementById('compareResult');
      if (!a || !b) {
        result.innerHTML = renderError('2匹とも候補から正確な名前を選んでください。');
        return;
      }
      const rows = [
        ['HP','hp'],
        ['こうげき','attack'],
        ['ぼうぎょ','defense'],
        ['とくこう','sp_attack'],
        ['とくぼう','sp_defense'],
        ['すばやさ','speed']
      ];
      const totalA = rows.reduce((s, [,k]) => s + Number(a[k]), 0);
      const totalB = rows.reduce((s, [,k]) => s + Number(b[k]), 0);
      const body = rows.map(([label,key]) => {
        const av = Number(a[key]), bv = Number(b[key]);
        const diff = av - bv;
        const verdict = diff > 0 ? `${escapeHtml(a.name)} +${diff}` : diff < 0 ? `${escapeHtml(b.name)} +${Math.abs(diff)}` : '同じ';
        return `<tr><th>${label}</th><td>${av}</td><td>${bv}</td><td>${verdict}</td></tr>`;
      }).join('') + `<tr><th>合計</th><td>${totalA}</td><td>${totalB}</td><td>${totalA===totalB ? '同じ' : totalA > totalB ? `${escapeHtml(a.name)} +${totalA-totalB}` : `${escapeHtml(b.name)} +${totalB-totalA}`}</td></tr>`;
      result.innerHTML = `<div class="result-card success">
        <div class="poke-name">${escapeHtml(a.name)} vs ${escapeHtml(b.name)}</div>
        <table class="stats">
          <tr><th>項目</th><th>${escapeHtml(a.name)}</th><th>${escapeHtml(b.name)}</th><th>比較</th></tr>
          ${body}
        </table>
      </div>`;
    }

    function classifyValues(mode, selectedType) {
      const groups = {'2倍':[], '等倍':[], '1/2倍':[], '無効':[]};
      ALL_TYPES.forEach(type => {
        const value = mode === 'attack'
          ? getComboMultiplier(selectedType, type, '')
          : getComboMultiplier(type, selectedType, '');
        if (value === 2) groups['2倍'].push(type);
        else if (value === 1) groups['等倍'].push(type);
        else if (value === 0.5) groups['1/2倍'].push(type);
        else if (value === 0) groups['無効'].push(type);
      });
      return groups;
    }

    function renderTypeMatchup() {
      const mode = document.getElementById('typeMode').value;
      const type = document.getElementById('typeSelect').value;
      const result = document.getElementById('typeResult');
      if (!ALL_TYPES.includes(type)) {
        result.innerHTML = renderError('タイプを選択してください。');
        return;
      }
      const groups = classifyValues(mode, type);
      const title = mode === 'attack' ? `${type}技で攻撃した場合` : `${type}タイプで受ける場合`;
      const htmlGroups = ['2倍','等倍','1/2倍','無効'].map(label => `
        <div class="match-group"><div class="match-title">${label}</div>
          <div class="chip-list">${groups[label].length ? groups[label].map(v => `<span class="chip">${escapeHtml(v)}</span>`).join('') : '<span class="chip">なし</span>'}</div>
        </div>`).join('');
      result.innerHTML = `<div class="result-card success"><div class="poke-name">${escapeHtml(title)}</div>${htmlGroups}</div>`;
    }

    function calculateActualStat(base, isHp=false) {
      const level = SETTINGS.level, iv = SETTINGS.iv, sp = SETTINGS.sp;
      if (isHp) return Math.floor(((2 * base + iv + (sp * 2)) * level) / 100) + level + 10;
      return Math.floor(((2 * base + iv + (sp * 2)) * level) / 100) + 5;
    }

    function getStab(attacker, moveType) {
      if (attacker.type1 !== moveType && attacker.type2 !== moveType) return 1.0;
      const abilities = `${attacker.abilities_all || ''} ${attacker.ability1 || ''} ${attacker.ability2 || ''} ${attacker.hidden_ability || ''}`;
      return abilities.includes('てきおうりょく') ? 2.0 : 1.5;
    }

    function getMovePower(move) {
      if (!move || move.category === 'status' || move.power === null || move.power === undefined || move.power === '') return null;
      if (move.special_rule === 'acrobatics') return Number(move.power) * 2;
      return Number(move.power);
    }

    function calculateDamagePercent(attacker, defender, move) {
      const typeMultiplier = getComboMultiplier(move.type, defender.type1, defender.type2);
      const defenderHp = calculateActualStat(Number(defender.hp), true);
      if (typeMultiplier === 0) {
        return { min: 0, max: 0, ohkoChance: 0, ohkoCount: 0, rollCount: 16, typeMultiplier, power: getMovePower(move) };
      }

      let attackBase, defenseBase;
      if (move.special_rule === 'defense_attack') {
        attackBase = Number(attacker.defense);
        defenseBase = Number(defender.defense);
      } else if (move.special_rule === 'target_attack') {
        attackBase = Number(defender.attack);
        defenseBase = Number(defender.defense);
      } else if (move.category === 'physical') {
        attackBase = Number(attacker.attack);
        defenseBase = Number(defender.defense);
      } else if (move.category === 'special') {
        attackBase = Number(attacker.sp_attack);
        defenseBase = move.special_rule === 'physical_defense' ? Number(defender.defense) : Number(defender.sp_defense);
      } else {
        return null;
      }

      const attackStat = calculateActualStat(attackBase, false);
      const defenseStat = calculateActualStat(defenseBase, false);
      const power = getMovePower(move);
      if (!power || !attackStat || !defenseStat) return null;

      const stab = getStab(attacker, move.type);
      const modifierWithoutRandom = stab * typeMultiplier;
      const baseDamage = Math.floor(Math.floor(Math.floor(((Math.floor((2 * SETTINGS.level) / 5) + 2) * power * attackStat) / defenseStat) / 50) + 2);
      const rolls = [];
      for (let r = 85; r <= 100; r++) {
        rolls.push(Math.max(1, Math.floor(baseDamage * modifierWithoutRandom * r / 100)));
      }
      const percents = rolls.map(v => v / defenderHp * 100);
      const ohkoCount = rolls.filter(v => v >= defenderHp).length;
      return {
        min: Math.min(...percents),
        max: Math.max(...percents),
        ohkoChance: ohkoCount / rolls.length * 100,
        ohkoCount,
        rollCount: rolls.length,
        typeMultiplier,
        power
      };
    }

    function renderDamage() {
      const attacker = getPokemonByExactName(document.getElementById('attackerName').value);
      const defender = getPokemonByExactName(document.getElementById('defenderName').value);
      const move = getMoveByExactName(document.getElementById('moveName').value);
      const result = document.getElementById('damageResult');
      if (!attacker || !defender || !move) {
        result.innerHTML = renderError('攻撃側、防御側、技を候補から正確に選んでください。');
        return;
      }
      const output = calculateDamagePercent(attacker, defender, move);
      if (!output) {
        result.innerHTML = renderError('この技はダメージ計算対象外です。');
        return;
      }
      result.innerHTML = `<div class="result-card success">
        <div class="mini">${escapeHtml(attacker.name)} → ${escapeHtml(defender.name)} / ${escapeHtml(move.name)}（${escapeHtml(move.type)}・${escapeHtml(CATEGORY_LABEL[move.category] || move.category)}・威力${output.power}）</div>
        <div class="damage-output">${output.min.toFixed(1)}%〜${output.max.toFixed(1)}%</div>
        <p class="mini">100%以上の確率: ${output.ohkoCount}/${output.rollCount}（${output.ohkoChance.toFixed(1)}%） / タイプ相性: ${output.typeMultiplier}倍</p>
        <p class="mini">計算条件: Lv.${SETTINGS.level} / 個体値${SETTINGS.iv}相当 / 能力ポイント${SETTINGS.sp}相当 / 性格補正なし / 道具補正なし</p>
      </div>`;
    }

    function getMoveEffect(move) {
      if (move.effect) return move.effect;
      if (move.special_rule && SPECIAL_RULE_LABEL[move.special_rule]) return SPECIAL_RULE_LABEL[move.special_rule];
      return '効果説明は未登録です。タイプ・分類・威力のみ登録されています。';
    }

    function renderMoveCard(move) {
      const ruleText = move.category === 'status' ? 'ダメージ計算対象外' : (move.special_rule ? (SPECIAL_RULE_LABEL[move.special_rule] || move.special_rule) : '通常処理');
      const calcPower = getMovePower(move);
      const powerText = calcPower == null ? '—' : (calcPower !== Number(move.power) ? `${move.power}（計算時 ${calcPower}）` : String(move.power));
      return `<div class="result-card success">
        <div class="name-line">
          <div class="move-name">${escapeHtml(move.name)}</div>
          <div class="types"><span class="type-pill">${escapeHtml(move.type)}</span><span class="type-pill">${escapeHtml(CATEGORY_LABEL[move.category] || move.category)}</span></div>
        </div>
        <div class="move-meta">
          <div class="meta-box"><span class="meta-label">タイプ</span><span class="meta-value">${escapeHtml(move.type)}</span></div>
          <div class="meta-box"><span class="meta-label">分類</span><span class="meta-value">${escapeHtml(CATEGORY_LABEL[move.category] || move.category)}</span></div>
          <div class="meta-box"><span class="meta-label">威力</span><span class="meta-value">${escapeHtml(powerText)}</span></div>
          <div class="meta-box"><span class="meta-label">登録</span><span class="meta-value">チャンピオンズ</span></div>
        </div>
        <p class="effect-text"><strong>効果:</strong> ${escapeHtml(getMoveEffect(move))}</p>
        <p class="mini"><strong>計算上の備考:</strong> ${escapeHtml(ruleText)}</p>
      </div>`;
    }

    function renderMoveSearch() {
      const keyword = document.getElementById('moveSearchName').value;
      const result = document.getElementById('moveSearchResult');
      if (!normalize(keyword)) {
        result.innerHTML = renderError('技名を入力してください。');
        return;
      }
      const results = searchMoveByName(keyword);
      if (!results.length) {
        result.innerHTML = renderError('該当する技が見つかりませんでした。');
        return;
      }
      result.innerHTML = results.map(renderMoveCard).join('');
    }

    function getEffectiveInputValue(input, composingText = '') {
      const value = input.value || '';
      const comp = composingText || '';
      if (!comp) return value;
      const valueKey = normalize(value);
      const compKey = normalize(comp);
      if (!compKey) return value;
      if (!valueKey) return comp;
      if (valueKey.includes(compKey)) return value;
      return value + comp;
    }

    function hideAllSuggestions(exceptBox = null) {
      document.querySelectorAll('.suggestions').forEach(box => {
        if (box !== exceptBox) box.hidden = true;
      });
    }

    function renderSuggestionButton(item, kind) {
      const title = kind === 'move' ? item.name : item.name;
      const sub = kind === 'move'
        ? `${item.type} / ${CATEGORY_LABEL[item.category] || item.category} / 威力${item.power}`
        : `${formatTypeText(item)} / ${item.abilities_all || '特性未登録'}`;
      return `<button type="button" class="suggestion-btn" data-name="${escapeHtml(title)}">${escapeHtml(title)}<span class="suggestion-sub">${escapeHtml(sub)}</span></button>`;
    }

    function setupAutocomplete(inputId, searchFn, kind, onSelect = null) {
      const input = document.getElementById(inputId);
      if (!input || input.dataset.autocompleteReady === '1') return;
      input.dataset.autocompleteReady = '1';

      const wrapper = document.createElement('div');
      wrapper.className = 'autocomplete-wrap';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);

      const box = document.createElement('div');
      box.className = 'suggestions';
      box.hidden = true;
      wrapper.appendChild(box);

      const update = (composingText = '') => {
        const query = getEffectiveInputValue(input, composingText);
        const key = normalize(query);
        if (!key) {
          box.hidden = true;
          box.innerHTML = '';
          return;
        }
        const results = searchFn(query).slice(0, 8);
        if (!results.length) {
          box.hidden = true;
          box.innerHTML = '';
          return;
        }
        box.innerHTML = results.map(item => renderSuggestionButton(item, kind)).join('');
        box.hidden = false;
        hideAllSuggestions(box);
      };

      input.addEventListener('input', () => update());
      input.addEventListener('compositionupdate', event => update(event.data || ''));
      input.addEventListener('compositionend', () => update());
      input.addEventListener('focus', () => update());

      box.addEventListener('pointerdown', event => {
        const button = event.target.closest('.suggestion-btn');
        if (!button) return;
        event.preventDefault();
        input.value = button.dataset.name || '';
        box.hidden = true;
        if (typeof onSelect === 'function') onSelect();
      });
    }

    function bindEvents() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      document.getElementById('searchBtn').addEventListener('click', renderPokemonSearch);
      document.getElementById('compareBtn').addEventListener('click', compareTwoPokemon);
      document.getElementById('typeBtn').addEventListener('click', renderTypeMatchup);
      document.getElementById('damageBtn').addEventListener('click', renderDamage);
      document.getElementById('moveSearchBtn').addEventListener('click', renderMoveSearch);

      document.getElementById('searchName').addEventListener('keydown', e => { if (e.key === 'Enter') renderPokemonSearch(); });
      document.getElementById('compareA').addEventListener('keydown', e => { if (e.key === 'Enter') compareTwoPokemon(); });
      document.getElementById('compareB').addEventListener('keydown', e => { if (e.key === 'Enter') compareTwoPokemon(); });
      document.getElementById('attackerName').addEventListener('keydown', e => { if (e.key === 'Enter') renderDamage(); });
      document.getElementById('defenderName').addEventListener('keydown', e => { if (e.key === 'Enter') renderDamage(); });
      document.getElementById('moveName').addEventListener('keydown', e => { if (e.key === 'Enter') renderDamage(); });
      document.getElementById('moveSearchName').addEventListener('keydown', e => { if (e.key === 'Enter') renderMoveSearch(); });

      setupAutocomplete('searchName', searchPokemonByName, 'pokemon');
      setupAutocomplete('compareA', searchPokemonByName, 'pokemon');
      setupAutocomplete('compareB', searchPokemonByName, 'pokemon');
      setupAutocomplete('attackerName', searchPokemonByName, 'pokemon');
      setupAutocomplete('defenderName', searchPokemonByName, 'pokemon');
      setupAutocomplete('moveName', searchMoveByName, 'move');
      setupAutocomplete('moveSearchName', searchMoveByName, 'move', renderMoveSearch);

      document.addEventListener('pointerdown', event => {
        if (!event.target.closest('.autocomplete-wrap')) hideAllSuggestions();
      });
    }

    populateInputs();
    bindEvents();
  </script>

</body>
</html>
